<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防護室耗材管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<style>
    :root{
        --paper:#FFFFFF;
        --paper-deep:#EAF1FE;
        --ink:#1F2430;
        --ink-soft:#5B6472;
        --ink-faint:#9AA3B2;
        --line:#E1E8F5;
        --card:#FFFFFF;
        --rose:#EA4335;
        --rose-deep:#C5221F;
        --steel:#4285F4;
        --steel-deep:#185ABC;
        --ochre:#FBBC05;
        --ochre-deep:#B98000;
        --moss:#34A853;
        --moss-deep:#1E7E3C;
        --shadow-card: 0 1px 2px rgba(31,36,48,.05), 0 8px 24px -12px rgba(31,36,48,.16);
        --shadow-pop: 0 20px 60px -20px rgba(31,36,48,.30);
    }
    *{ scrollbar-color: var(--ink-faint) transparent; }
    body{
        font-family:'Inter',sans-serif;
        background-color: var(--paper);
        color: var(--ink);
    }
    .font-display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
    .font-mono{ font-family:'JetBrains Mono',monospace; }

    ::selection{ background: var(--steel); color:#fff; }

    /* Tape strip signature element */
    .tape-card{ position:relative; overflow:visible; }
    .tape-card::before{
        content:'';
        position:absolute; top:-9px; left:22px;
        width:52px; height:18px;
        background: var(--tape-color, var(--steel));
        opacity:.92;
        transform: rotate(-4deg);
        clip-path: polygon(3% 0,97% 0,100% 100%,0% 100%);
        box-shadow: 0 3px 6px rgba(33,30,26,.22);
        transition: transform .25s ease;
    }
    .tape-card:hover::before{ transform: rotate(-1deg) translateY(-1px); }

    .paper-card{
        background: var(--card);
        border:1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow-card);
    }

    .nav-tab{
        font-family:'Space Grotesk',sans-serif;
        transition: all .18s ease;
    }
    .nav-tab.active{ background:#fff; color: var(--steel-deep); box-shadow: 0 4px 14px -4px rgba(0,0,0,.35); }
    .nav-tab:not(.active){ color: rgba(255,255,255,.75); }
    .nav-tab:not(.active):hover{ color:#fff; background: rgba(255,255,255,.14); }

    .btn-primary{ background: var(--steel); color:#fff; transition: all .15s ease; }
    .btn-primary:hover{ background: var(--steel-deep); transform: translateY(-1px); box-shadow: 0 8px 18px -8px rgba(24,90,188,.45); }
    .btn-primary:active{ transform: translateY(0); }

    .btn-steel{ background: var(--steel); color:#fff; transition: all .15s ease; }
    .btn-steel:hover{ background: var(--steel-deep); transform: translateY(-1px); }

    .btn-ghost{ background: var(--card); border:1px solid var(--line); color: var(--ink); transition: all .15s ease; }
    .btn-ghost:hover{ background: var(--paper-deep); }

    .field-input{
        background: var(--paper); border:1px solid var(--line); border-radius:12px; color: var(--ink);
        transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field-input:focus{ outline:none; border-color: var(--steel); box-shadow: 0 0 0 3px rgba(66,133,244,.15); background:#fff; }

    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
        outline: 2px solid var(--steel); outline-offset: 2px;
    }

    .stat-card{ border-left: 4px solid var(--tag-color, var(--steel)); }

    .tag-pill{
        font-family:'JetBrains Mono',monospace;
        font-size:10px; letter-spacing:.02em; font-weight:600;
        padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px;
        color:#fff;
    }

    .qty{ font-family:'JetBrains Mono',monospace; font-weight:700; font-variant-numeric: tabular-nums; }

    @keyframes fadeSlide{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform: translateY(0);} }
    .view-enter{ animation: fadeSlide .28s ease both; }

    @keyframes toastIn{ from{ opacity:0; transform: translateX(24px) rotate(2deg);} to{ opacity:1; transform: translateX(0) rotate(0);} }
    .toast-item{ animation: toastIn .25s cubic-bezier(.2,.9,.3,1.2) both; }

    @keyframes pulseDot{ 0%,100%{ opacity:1;} 50%{ opacity:.35;} }
    .pulse-dot{ animation: pulseDot 1.3s ease-in-out infinite; }

    @keyframes shimmer{ 0%{ background-position: -300px 0;} 100%{ background-position: 300px 0;} }
    .skeleton{
        background: linear-gradient(90deg, var(--paper-deep) 25%, #fff 37%, var(--paper-deep) 63%);
        background-size: 300px 100%;
        animation: shimmer 1.4s ease infinite;
        border-radius: 10px;
    }

    .low-badge{ animation: pulseDot 1.8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce){
        *{ animation-duration: 0.001ms !important; animation-iteration-count:1 !important; transition-duration: 0.001ms !important; }
    }

    ::-webkit-scrollbar{ width:8px; height:8px; }
    ::-webkit-scrollbar-thumb{ background: var(--ink-faint); border-radius:8px; }
    ::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body class="flex flex-col min-h-screen">

<div id="toast-container" class="fixed top-5 right-5 z-[60] flex flex-col gap-2 w-[min(90vw,320px)]"></div>

<div id="sync-indicator" class="hidden fixed bottom-5 right-5 z-[60] bg-[var(--steel)] text-white px-4 py-2.5 rounded-2xl shadow-2xl items-center gap-2.5 text-xs font-medium font-mono">
    <span class="w-2 h-2 rounded-full bg-white pulse-dot"></span>
    <span id="sync-indicator-text">正在同步至 Google 試算表…</span>
</div>

<header class="bg-[var(--steel)] text-white sticky top-0 z-40 border-b border-black/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-white/15 w-10 h-10 rounded-xl flex items-center justify-center shadow-inner shrink-0 rotate-[-3deg]">
                <i data-lucide="shield-plus" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="font-display text-lg font-bold tracking-tight leading-tight">防護室耗材管理系統</h1>
                <p class="text-[11px] text-white/45 flex items-center gap-1 font-mono">
                    <span id="sheet-status-dot" class="w-1.5 h-1.5 rounded-full bg-[var(--ink-faint)]"></span>
                    <span id="sheet-status-text">尚未連接 Google 試算表</span>
                </p>
            </div>
        </div>

        <div class="flex items-center gap-2 flex-wrap">
            <button id="nav-visitor-btn" onclick="switchView('visitor')" class="nav-tab px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i> 訪客登記
            </button>
            <div id="auth-nav-buttons" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="main-content-area"></main>

<!-- Transfer Modal -->
<div id="transfer-modal" class="hidden fixed inset-0 bg-[var(--ink)]/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--line)] max-h-[85vh] overflow-y-auto">
        <h3 class="font-display text-lg font-bold mb-3">倉庫調撥至外區工作台</h3>
        <div id="transfer-modal-content"></div>
    </div>
</div>

<!-- Edit Stock Modal -->
<div id="edit-modal" class="hidden fixed inset-0 bg-[var(--ink)]/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--line)] max-h-[85vh] overflow-y-auto">
        <h3 class="font-display text-lg font-bold mb-3">編輯庫存與批次到期日</h3>
        <div id="edit-modal-content"></div>
    </div>
</div>

<!-- Add Item Modal -->
<div id="add-modal" class="hidden fixed inset-0 bg-[var(--ink)]/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--line)]">
        <h3 class="font-display text-lg font-bold mb-1">新增防護室耗材品項</h3>
        <form onsubmit="handleAddSubmit(event)" class="space-y-4 mt-3">
            <div>
                <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">耗材名稱</label>
                <input type="text" id="add-name-input" placeholder="例如：新式彈性繃帶" class="w-full px-3.5 py-2.5 field-input text-sm" required>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">分類</label>
                    <select id="add-cat-input" class="w-full px-3 py-2.5 field-input text-xs font-medium">
                        <option value="彈性繃帶">彈性繃帶</option>
                        <option value="運動白貼">運動白貼</option>
                        <option value="肌內效貼布">肌內效貼布</option>
                        <option value="動力貼布">動力貼布</option>
                        <option value="教學耗材">教學耗材</option>
                        <option value="防護裝備">防護裝備</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">單位</label>
                    <input type="text" id="add-unit-input" value="卷" class="w-full px-3 py-2.5 field-input text-xs">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">初始倉庫庫存</label>
                    <input type="number" id="add-warehouse-input" value="20" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">初始外區現貨</label>
                    <input type="number" id="add-outer-input" value="5" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">最低警戒值（外區現貨低於此值會標示提醒）</label>
                <input type="number" id="add-min-input" value="3" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeModal('add-modal')" class="flex-1 btn-ghost py-2.5 rounded-xl text-xs font-semibold">取消</button>
                <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-xs font-semibold">確認新增</button>
            </div>
        </form>
    </div>
</div>

<footer class="border-t border-[var(--line)] py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-[11px] text-[var(--ink-faint)] font-mono">
        防護室耗材管理系統 · 試算表 ID：<span id="footer-sheet-id">未設定</span>
    </div>
</footer>

<script>
    // ---------- State ----------
    let currentView = 'visitor'; // 'visitor' | 'admin' | 'login'
    let isLoggedIn = false;
    let isLoadingData = true;
    let activeItemIdForTransfer = null;
    let activeItemIdForEdit = null;
    let adminCategoryFilter = 'all';

    const ADMIN_CREDENTIALS = { user: 'user', pass: 'wanti1211' };

    // 分類貼紙統一採用 Google 四色系統（藍/紅/黃/綠），六個分類循環套用
    const CATEGORY_STYLES = {
        '彈性繃帶':   { bg: '#4285F4', text: '#fff' },
        '運動白貼':   { bg: '#34A853', text: '#fff' },
        '肌內效貼布': { bg: '#EA4335', text: '#fff' },
        '動力貼布':   { bg: '#FBBC05', text: '#1F2430' },
        '教學耗材':   { bg: '#4285F4', text: '#fff' },
        '防護裝備':   { bg: '#34A853', text: '#fff' }
    };
    function categoryStyle(cat){ return CATEGORY_STYLES[cat] || { bg: 'var(--paper-deep)', text: 'var(--ink-soft)' }; }
    function categoryColor(cat){ return categoryStyle(cat).bg; }
    function categoryTextColor(cat){ return categoryStyle(cat).text; }

    const DEFAULT_WEBHOOK_URL = 'https://shelter-proxy.ntustssat.workers.dev';
    const sheetConfig = {
        spreadsheetId: '',
        webhookUrl: DEFAULT_WEBHOOK_URL,
        lastSynced: '尚未同步'
    };

    // ---------- 批次到期日管理 ----------
    // 同一品項可能分好幾批進貨、每批到期日不同（例如同一款繃帶，一批 10/5 到期、一批隔年 6/10 到期）
    // 用 item.batches 陣列各自記錄數量／到期日／存放位置；有登記批次的品項，倉庫庫存與外區現貨一律由批次加總算出
    const EXPIRY_WARNING_DAYS = 60;

    function recomputeItemStock(item) {
        const batches = item.batches || [];
        item.warehouseStock = batches.filter(b => b.location === 'warehouse').reduce((s, b) => s + (Number(b.qty) || 0), 0);
        item.outerStock = batches.filter(b => b.location === 'outer').reduce((s, b) => s + (Number(b.qty) || 0), 0);
    }

    function daysUntil(dateStr) {
        if (!dateStr) return null;
        const today = new Date(); today.setHours(0, 0, 0, 0);
        const target = new Date(dateStr + 'T00:00:00');
        if (isNaN(target.getTime())) return null;
        return Math.round((target - today) / 86400000);
    }

    function daysLeftLabel(days) {
        if (days === null) return '';
        return days < 0 ? `已過期 ${Math.abs(days)} 天` : `剩 ${days} 天`;
    }

    // 依「陣列中出現的順序」依序扣除指定位置（倉庫／外區）的批次數量，不特別挑快到期或慢到期的批次
    function deductFromBatches(item, location, qty) {
        let remaining = qty;
        (item.batches || []).forEach(b => {
            if (remaining <= 0 || b.location !== location) return;
            const take = Math.min(b.qty, remaining);
            b.qty -= take;
            remaining -= take;
        });
        item.batches = (item.batches || []).filter(b => b.qty > 0);
    }

    // 掃描所有品項的所有批次，抓出「已過期」或「N 天內到期」的批次，依剩餘天數由少到多排序
    function getExpiryAlerts() {
        const alerts = [];
        items.forEach(item => {
            (item.batches || []).forEach(b => {
                if (!b.qty || !b.expiryDate) return;
                const days = daysUntil(b.expiryDate);
                if (days === null || days > EXPIRY_WARNING_DAYS) return;
                alerts.push({
                    itemId: item.id, itemName: item.name, batchId: b.id,
                    qty: b.qty, expiryDate: b.expiryDate, location: b.location,
                    daysLeft: days, expired: days < 0
                });
            });
        });
        alerts.sort((a, b) => a.daysLeft - b.daysLeft);
        return alerts;
    }

    const SEED_ITEMS = [
        { id: 'item-1', name: '輕彈 1.5 寸', category: '彈性繃帶', warehouseStock: 50, outerStock: 10, unit: '卷', minThreshold: 5 },
        { id: 'item-2', name: '重彈 2 寸', category: '彈性繃帶', warehouseStock: 40, outerStock: 8, unit: '卷', minThreshold: 4 },
        { id: 'item-3', name: '重彈 3 寸', category: '彈性繃帶', warehouseStock: 30, outerStock: 6, unit: '卷', minThreshold: 3 },
        { id: 'item-4', name: '白貼 1.5 寸', category: '運動白貼', warehouseStock: 60, outerStock: 12, unit: '卷', minThreshold: 6 },
        { id: 'item-5', name: '防護手套', category: '防護裝備', warehouseStock: 200, outerStock: 30, unit: '副', minThreshold: 20 },
        { id: 'item-6', name: '彈繃', category: '彈性繃帶', warehouseStock: 40, outerStock: 10, unit: '卷', minThreshold: 5 },
        { id: 'item-7', name: '上課用白貼 1.5 寸', category: '教學耗材', warehouseStock: 100, outerStock: 20, unit: '卷', minThreshold: 10 },
        { id: 'item-8', name: '上課用肌貼', category: '教學耗材', warehouseStock: 80, outerStock: 15, unit: '卷', minThreshold: 8 },
        { id: 'item-9', name: '日東肌貼黑色', category: '肌內效貼布', warehouseStock: 25, outerStock: 5, unit: '卷', minThreshold: 3 },
        { id: 'item-10', name: '日東肌貼粉色', category: '肌內效貼布', warehouseStock: 25, outerStock: 5, unit: '卷', minThreshold: 3 },
        { id: 'item-11', name: '日東肌貼藍色', category: '肌內效貼布', warehouseStock: 25, outerStock: 5, unit: '卷', minThreshold: 3 },
        { id: 'item-12', name: 'Dynamic Tape 5 cm', category: '動力貼布', warehouseStock: 20, outerStock: 4, unit: '卷', minThreshold: 2 },
        { id: 'item-13', name: 'Dynamic Tape 7.5 cm', category: '動力貼布', warehouseStock: 15, outerStock: 3, unit: '卷', minThreshold: 2 }
    ];
    // 原本的示範資料尚未登記到期日，先統一補一筆 2027/1/1（數量沿用目前的倉庫庫存／外區現貨）
    SEED_ITEMS.forEach(item => {
        item.batches = [];
        if (item.warehouseStock > 0) item.batches.push({ id: 'batch-' + item.id + '-wh', qty: item.warehouseStock, expiryDate: '2027-01-01', location: 'warehouse' });
        if (item.outerStock > 0) item.batches.push({ id: 'batch-' + item.id + '-out', qty: item.outerStock, expiryDate: '2027-01-01', location: 'outer' });
    });

    let items = [];
    let logs = [];
    let visitorCart = {};
    let shortageAlerts = []; // 外區現貨在領用當下不足、需由倉庫補足的紅燈通知

    // ---------- Local cache (offline safety net) ----------
    function loadLocalCache() {
        try {
            const cachedItems = JSON.parse(localStorage.getItem('shelterItems') || 'null');
            const cachedLogs = JSON.parse(localStorage.getItem('shelterLogs') || 'null');
            const cachedAlerts = JSON.parse(localStorage.getItem('shelterShortageAlerts') || 'null');
            if (cachedItems) items = cachedItems;
            if (cachedLogs) logs = cachedLogs;
            if (cachedAlerts) shortageAlerts = cachedAlerts;
        } catch (e) { /* ignore malformed cache */ }
    }
    function saveLocalCache() {
        try {
            localStorage.setItem('shelterItems', JSON.stringify(items));
            localStorage.setItem('shelterLogs', JSON.stringify(logs));
            localStorage.setItem('shelterShortageAlerts', JSON.stringify(shortageAlerts));
        } catch (e) { /* storage unavailable, skip silently */ }
    }

    // ---------- Toast ----------
    function safeCreateIcons() {
        try {
            if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
        } catch (e) {
            console.warn('圖示載入失敗（不影響其他功能）：', e);
        }
    }

    window.addEventListener('error', function (evt) {
        console.error('頁面發生未預期錯誤：', evt.error || evt.message);
    });

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const palettes = {
            error:   { bg: '#FCE8E6', border: '#F5B7B1', text: '#C5221F', icon: 'alert-triangle' },
            warning: { bg: '#FEF7E0', border: '#FCD980', text: '#B98000', icon: 'alert-circle' },
            info:    { bg: '#E8F0FE', border: '#AECBFA', text: '#185ABC', icon: 'info' },
            success: { bg: '#E6F4EA', border: '#A8DAB5', text: '#1E7E3C', icon: 'check-circle' }
        };
        const p = palettes[type] || palettes.success;
        toast.className = 'toast-item px-4 py-3 rounded-xl shadow-lg border flex items-center gap-2.5 text-sm font-medium';
        toast.style.background = p.bg; toast.style.borderColor = p.border; toast.style.color = p.text;
        toast.innerHTML = `<i data-lucide="${p.icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
        container.appendChild(toast);
        safeCreateIcons();
        setTimeout(() => {
            toast.style.transition = 'opacity .3s ease, transform .3s ease';
            toast.style.opacity = '0'; toast.style.transform = 'translateX(16px)';
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }

    // ---------- Sheet status pill ----------
    function updateSheetStatusPill(state) {
        const dot = document.getElementById('sheet-status-dot');
        const text = document.getElementById('sheet-status-text');
        if (!dot || !text) return;
        if (state === 'connected') {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--moss)]';
            text.textContent = '已連接試算表 · ' + sheetConfig.lastSynced;
        } else if (state === 'error') {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--rose)] pulse-dot';
            text.textContent = '同步失敗，請檢查串接設定';
        } else if (state === 'loading') {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--steel)] pulse-dot';
            text.textContent = '載入中…';
        } else {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--ink-faint)]';
            text.textContent = '尚未連接 Google 試算表';
        }
    }

    // ---------- Load from Google Sheet (doGet) ----------
    async function loadFromSheet(silent) {
        if (!sheetConfig.webhookUrl) {
            loadLocalCache();
            if (items.length === 0) items = JSON.parse(JSON.stringify(SEED_ITEMS));
            isLoadingData = false;
            updateSheetStatusPill('idle');
            render();
            return;
        }
        updateSheetStatusPill('loading');
        if (!silent) isLoadingData = true;
        render();
        try {
            const res = await fetch(sheetConfig.webhookUrl, { method: 'GET' });
            const data = await res.json();
            if (data.status === 'success') {
                items = data.items && data.items.length ? data.items : items;
                logs = data.logs || logs;
                sheetConfig.lastSynced = '剛剛已從試算表載入';
                updateSheetStatusPill('connected');
                saveLocalCache();
                if (!silent) showToast('已從 Google 試算表載入最新資料！');
            } else {
                throw new Error(data.message || '未知錯誤');
            }
        } catch (err) {
            console.error('Sheet load error:', err);
            loadLocalCache();
            if (items.length === 0) items = JSON.parse(JSON.stringify(SEED_ITEMS));
            updateSheetStatusPill('error');
            showToast('無法載入試算表資料，已改用本機備份資料', 'warning');
        }
        isLoadingData = false;
        render();
    }

    // ---------- Sync to Google Sheet (doPost) ----------
    async function syncToGoogleSheet(actionType, payloadData) {
        saveLocalCache();
        if (!sheetConfig.webhookUrl) return;
        const indicator = document.getElementById('sync-indicator');
        indicator.classList.remove('hidden'); indicator.classList.add('flex');

        try {
            const payload = { action: actionType, timestamp: new Date().toLocaleString(), items: items, log: (actionType === 'VISITOR_CHECKOUT' ? payloadData : undefined) };
            const res = await fetch(sheetConfig.webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            indicator.classList.add('hidden'); indicator.classList.remove('flex');
            if (data.status === 'success') {
                sheetConfig.lastSynced = '已同步（' + new Date().toLocaleTimeString() + '）';
                updateSheetStatusPill('connected');
            } else {
                throw new Error(data.message || '未知錯誤');
            }
        } catch (err) {
            indicator.classList.add('hidden'); indicator.classList.remove('flex');
            console.error('Sheet Sync Error:', err);
            updateSheetStatusPill('error');
            showToast('已儲存在本機，但同步至試算表失敗，請確認串接設定', 'warning');
        }
        if (currentView === 'admin') { const c = document.getElementById('main-content-area'); if (c) renderAdminView(c); }
    }

    // ---------- Category tag helper ----------
    function categoryTag(cat) {
        const s = categoryStyle(cat);
        return `<span class="tag-pill" style="background:${s.bg};color:${s.text}">${cat}</span>`;
    }

    function escapeXml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ---------- Charts (純 SVG，不額外載入圖表函式庫) ----------
    function buildCategoryStockChartSVG() {
        const totals = {};
        items.forEach(i => { totals[i.category] = (totals[i.category] || 0) + i.warehouseStock + i.outerStock; });
        const cats = Object.keys(totals);
        if (cats.length === 0) return '<p class="text-xs text-[var(--ink-faint)] italic text-center py-10">尚無資料可供繪製</p>';

        const maxVal = Math.max.apply(null, cats.map(c => totals[c]).concat([1]));
        const barW = 40, gap = 26, chartH = 150, topPad = 20, bottomPad = 34;
        const W = cats.length * (barW + gap) + gap;
        const H = topPad + chartH + bottomPad;

        let bars = '';
        cats.forEach((cat, idx) => {
            const val = totals[cat];
            const h = Math.max(4, Math.round((val / maxVal) * chartH));
            const x = gap + idx * (barW + gap);
            const y = topPad + (chartH - h);
            bars += `
                <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="7" fill="${categoryColor(cat)}"></rect>
                <text x="${x + barW / 2}" y="${y - 7}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="var(--ink)">${val}</text>
                <text x="${x + barW / 2}" y="${topPad + chartH + 18}" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="var(--ink-soft)">${escapeXml(cat)}</text>`;
        });

        return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" style="max-height:210px" role="img" aria-label="各分類庫存總量長條圖">
            <line x1="0" y1="${topPad + chartH}" x2="${W}" y2="${topPad + chartH}" stroke="var(--line)" stroke-width="1"></line>
            ${bars}
        </svg>`;
    }

    function buildTopItemsChartSVG() {
        const totals = {};
        logs.forEach(l => (l.itemsUsed || []).forEach(u => { totals[u.name] = (totals[u.name] || 0) + (Number(u.qty) || 0); }));
        const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]).slice(0, 5);
        if (sorted.length === 0) return '<p class="text-xs text-[var(--ink-faint)] italic text-center py-10">尚無領用紀錄可供統計</p>';

        const maxVal = Math.max.apply(null, sorted.map(s => s[1]).concat([1]));
        const rowH = 26, gap = 12, labelW = 128, barMaxW = 220, rightPad = 34;
        const W = labelW + barMaxW + rightPad;
        const H = sorted.length * (rowH + gap);

        let rows = '';
        sorted.forEach(([name, val], idx) => {
            const w = Math.max(6, Math.round((val / maxVal) * barMaxW));
            const y = idx * (rowH + gap);
            const label = name.length > 10 ? name.slice(0, 10) + '…' : name;
            rows += `
                <text x="0" y="${y + rowH / 2 + 4}" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="var(--ink)">${escapeXml(label)}</text>
                <rect x="${labelW}" y="${y + 3}" width="${barMaxW}" height="${rowH - 6}" rx="6" fill="var(--paper-deep)"></rect>
                <rect x="${labelW}" y="${y + 3}" width="${w}" height="${rowH - 6}" rx="6" fill="var(--steel)"></rect>
                <text x="${labelW + barMaxW + 10}" y="${y + rowH / 2 + 4}" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="var(--ink)">${val}</text>`;
        });

        return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" style="max-height:210px" role="img" aria-label="熱門耗材前五名長條圖">${rows}</svg>`;
    }

    // ---------- Actions & Handlers ----------
    function updateCart(itemId, delta) {
        const current = visitorCart[itemId] || 0;
        const updated = Math.max(0, current + delta);
        if (updated === 0) delete visitorCart[itemId]; else visitorCart[itemId] = updated;

        // 只更新該卡片的數字與右側清單，不重繪整個畫面，避免每點一次就整頁刷新
        const qtyEl = document.getElementById('qty-' + itemId);
        if (qtyEl) qtyEl.textContent = visitorCart[itemId] || 0;
        const cartListEl = document.getElementById('cart-summary-list');
        if (cartListEl) cartListEl.innerHTML = buildCartListHtml();
    }

    function handleVisitorSubmit(event) {
        event.preventDefault();
        const name = document.getElementById('visitor-name').value.trim();
        const purpose = document.getElementById('visitor-purpose').value.trim() || '日常防護使用';
        const entries = Object.entries(visitorCart).filter(([id, q]) => q > 0);

        if (!name) { showToast('請輸入領用人姓名', 'error'); return; }
        if (entries.length === 0) { showToast('請至少選擇一項耗材數量', 'error'); return; }

        let usedSummary = [];
        let newAlerts = [];
        for (let [itemId, reqQty] of entries) {
            let item = items.find(i => i.id === itemId);
            if (!item) continue;
            let needed = parseInt(reqQty);
            let fromOuter = Math.min(item.outerStock, needed);
            let remainder = needed - fromOuter;
            let fromWarehouse = Math.min(item.warehouseStock, remainder);
            const hasBatches = item.batches && item.batches.length > 0;

            if (hasBatches) {
                // 有登記批次到期日的品項：依批次陣列順序扣除，並重新加總庫存數字
                if (fromOuter > 0) deductFromBatches(item, 'outer', fromOuter);
                if (fromWarehouse > 0) deductFromBatches(item, 'warehouse', fromWarehouse);
                recomputeItemStock(item);
            } else {
                item.outerStock -= fromOuter;
                item.warehouseStock -= fromWarehouse;
            }

            if (fromWarehouse > 0) {
                // 外區現貨不足、需動用倉庫庫存，記一筆紅燈通知給負責人
                newAlerts.push({
                    id: 'alert-' + Date.now() + '-' + itemId,
                    itemName: item.name,
                    qty: fromWarehouse,
                    userName: name,
                    timestamp: new Date().toLocaleString()
                });
            }
            usedSummary.push({ name: item.name, qty: fromOuter + fromWarehouse });
        }

        const newLog = {
            id: 'log-' + Date.now(),
            timestamp: new Date().toLocaleString(),
            userName: name,
            purpose: purpose,
            itemsUsed: usedSummary
        };

        logs.unshift(newLog);
        visitorCart = {};
        showToast('耗材領用登記成功！');
        if (newAlerts.length > 0) {
            shortageAlerts = newAlerts.concat(shortageAlerts);
            const alertText = newAlerts.map(a => `${a.itemName} ×${a.qty}`).join('、');
            showToast(`外區現貨不足，已由倉庫補足：${alertText}，請通知負責人補貨`, 'error');
        }
        syncToGoogleSheet('VISITOR_CHECKOUT', newLog);
        render();
    }

    // ---------- Modals ----------
    // ---------- Transfer Modal（有登記批次時，手動選批次調撥；沒有的話沿用簡易數量輸入）----------
    function openTransferModal(itemId) {
        activeItemIdForTransfer = itemId;
        renderTransferModalContent();
        document.getElementById('transfer-modal').classList.remove('hidden');
    }

    function renderTransferModalContent() {
        const item = items.find(i => i.id === activeItemIdForTransfer);
        const container = document.getElementById('transfer-modal-content');
        if (!item || !container) return;

        const warehouseBatches = (item.batches || [])
            .filter(b => b.location === 'warehouse' && b.qty > 0)
            .sort((a, b) => (a.expiryDate || '').localeCompare(b.expiryDate || ''));

        if (warehouseBatches.length > 0) {
            const rows = warehouseBatches.map(b => {
                const days = daysUntil(b.expiryDate);
                const urgent = days !== null && days <= EXPIRY_WARNING_DAYS;
                return `
                    <div class="flex items-center gap-2 bg-[var(--paper)] border border-[var(--line)] rounded-lg px-3 py-2 text-xs flex-wrap">
                        <span class="font-mono font-semibold">${b.expiryDate}</span>
                        <span class="${urgent ? (days < 0 ? 'text-[var(--rose-deep)]' : 'text-[var(--ochre-deep)]') : 'text-[var(--ink-faint)]'}">${daysLeftLabel(days)}</span>
                        <span class="text-[var(--ink-soft)]">現有 ${b.qty} ${item.unit}</span>
                        <input type="number" min="0" max="${b.qty}" value="0" data-batch-id="${b.id}" data-expiry="${b.expiryDate}"
                            class="batch-transfer-qty field-input text-xs font-mono font-bold w-16 px-2 py-1 text-center ml-auto">
                    </div>`;
            }).join('');
            container.innerHTML = `
                <p class="text-xs text-[var(--ink-soft)] mb-1">品項：<span class="font-semibold text-[var(--ink)]">${item.name}</span></p>
                <p class="text-xs text-[var(--ink-faint)] mb-3">此品項有登記批次到期日，請手動選擇要從哪個批次調撥到外區工作台：</p>
                <div class="space-y-1.5 max-h-56 overflow-y-auto pr-1 mb-4">${rows}</div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeModal('transfer-modal')" class="flex-1 btn-ghost py-2.5 rounded-xl text-xs font-semibold">取消</button>
                    <button type="button" onclick="handleBatchTransferSubmit()" class="flex-1 btn-steel py-2.5 rounded-xl text-xs font-semibold">確認調撥</button>
                </div>`;
        } else {
            container.innerHTML = `
                <p class="text-xs text-[var(--ink-soft)] mb-3">品項：<span class="font-semibold text-[var(--ink)]">${item.name}</span>（內倉存量：${item.warehouseStock} ${item.unit}）</p>
                <form onsubmit="handleTransferSubmit(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">調撥數量</label>
                        <input type="number" id="transfer-qty-input" min="1" max="${item.warehouseStock}" value="${Math.min(5, item.warehouseStock) || 1}" class="w-full px-3.5 py-2.5 field-input text-sm font-bold font-mono" required>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button type="button" onclick="closeModal('transfer-modal')" class="flex-1 btn-ghost py-2.5 rounded-xl text-xs font-semibold">取消</button>
                        <button type="submit" class="flex-1 btn-steel py-2.5 rounded-xl text-xs font-semibold">確認調撥</button>
                    </div>
                </form>`;
        }
        safeCreateIcons();
    }

    function handleTransferSubmit(event) {
        event.preventDefault();
        const qty = parseInt(document.getElementById('transfer-qty-input').value);
        const item = items.find(i => i.id === activeItemIdForTransfer);
        if (item.warehouseStock < qty) { showToast('倉庫庫存不足！', 'error'); return; }

        item.warehouseStock -= qty;
        item.outerStock += qty;
        closeModal('transfer-modal');
        showToast('調撥成功！');
        syncToGoogleSheet('TRANSFER_STOCK', { itemId: item.id, qty });
        render();
    }

    function handleBatchTransferSubmit() {
        const item = items.find(i => i.id === activeItemIdForTransfer);
        if (!item) return;
        const inputs = document.querySelectorAll('.batch-transfer-qty');
        let totalMoved = 0;

        inputs.forEach(inp => {
            const qty = Math.max(0, parseInt(inp.value) || 0);
            if (qty <= 0) return;
            const batch = (item.batches || []).find(b => b.id === inp.getAttribute('data-batch-id'));
            if (!batch) return;
            const expiry = inp.getAttribute('data-expiry');
            const moveQty = Math.min(qty, batch.qty);
            batch.qty -= moveQty;
            totalMoved += moveQty;
            // 調撥到外區後到期日不變，優先合併進同到期日的外區批次，沒有的話新增一筆
            let outerBatch = item.batches.find(b => b.location === 'outer' && b.expiryDate === expiry);
            if (outerBatch) outerBatch.qty += moveQty;
            else item.batches.push({ id: 'batch-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), qty: moveQty, expiryDate: expiry, location: 'outer' });
        });

        if (totalMoved === 0) { showToast('請至少輸入一個批次的調撥數量', 'error'); return; }

        item.batches = item.batches.filter(b => b.qty > 0);
        recomputeItemStock(item);
        closeModal('transfer-modal');
        showToast('調撥成功！');
        syncToGoogleSheet('TRANSFER_STOCK', { itemId: item.id });
        render();
    }

                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">外區現貨（工作台）</label>
                    <input type="number" id="edit-outer-input" min="0" value="${item.outerStock}" class="w-full px-3.5 py-2.5 field-input text-sm font-bold font-mono" required>
                </div>
                <button type="submit" class="w-full btn-steel py-2.5 rounded-xl text-xs font-semibold">儲存數量</button>
            </form>`}

            <div class="space-y-2 mb-4">
                <span class="text-xs font-semibold text-[var(--ink-soft)] block">批次到期管理</span>
                <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">${batchRowsHtml}</div>
            </div>

            <div class="bg-[var(--paper)] border border-[var(--line)] rounded-xl p-3 space-y-2">
                <span class="text-xs font-semibold text-[var(--ink-soft)] block">新增批次</span>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="new-batch-qty" min="1" value="1" placeholder="數量" class="field-input text-xs px-2.5 py-2 font-mono">
                    <input type="date" id="new-batch-expiry" class="field-input text-xs px-2.5 py-2">
                </div>
                <select id="new-batch-location" class="w-full field-input text-xs px-2.5 py-2 bg-white">
                    <option value="warehouse">放倉庫</option>
                    <option value="outer">放外區</option>
                </select>
                <button type="button" onclick="addBatch()" class="w-full btn-primary py-2 rounded-lg text-xs font-semibold">加入批次</button>
            </div>
            <button type="button" onclick="closeModal('edit-modal')" class="w-full btn-ghost py-2.5 rounded-xl text-xs font-semibold mt-4">關閉</button>`;
        safeCreateIcons();
    }

    function handleEditSubmit(event) {
        event.preventDefault();
        const item = items.find(i => i.id === activeItemIdForEdit);
        item.warehouseStock = parseInt(document.getElementById('edit-warehouse-input').value) || 0;
        item.outerStock = parseInt(document.getElementById('edit-outer-input').value) || 0;
        showToast('庫存數量已更新！');
        syncToGoogleSheet('UPDATE_INVENTORY', { itemId: item.id });
        renderEditModalContent();
        render();
    }

    function addBatch() {
        const item = items.find(i => i.id === activeItemIdForEdit);
        if (!item) return;
        const qty = parseInt(document.getElementById('new-batch-qty').value) || 0;
        const expiry = document.getElementById('new-batch-expiry').value;
        const location = document.getElementById('new-batch-location').value;
        if (qty <= 0) { showToast('數量需大於 0', 'error'); return; }
        if (!expiry) { showToast('請選擇到期日', 'error'); return; }

        const wasEmpty = !item.batches || item.batches.length === 0;
        if (!item.batches) item.batches = [];
        item.batches.push({ id: 'batch-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), qty, expiryDate: expiry, location });
        recomputeItemStock(item);

        showToast(wasEmpty ? '已切換為批次管理，庫存數量現在由批次加總計算' : '已新增批次', wasEmpty ? 'info' : 'success');
        syncToGoogleSheet('UPDATE_INVENTORY', { itemId: item.id });
        renderEditModalContent();
        render();
    }

    function updateBatchQty(batchId, value) {
        const item = items.find(i => i.id === activeItemIdForEdit);
        if (!item) return;
        const batch = (item.batches || []).find(b => b.id === batchId);
        if (!batch) return;
        batch.qty = Math.max(0, parseInt(value) || 0);
        item.batches = item.batches.filter(b => b.qty > 0);
        recomputeItemStock(item);
        syncToGoogleSheet('UPDATE_INVENTORY', { itemId: item.id });
        renderEditModalContent();
        render();
    }

    function removeBatch(batchId) {
        const item = items.find(i => i.id === activeItemIdForEdit);
        if (!item) return;
        item.batches = (item.batches || []).filter(b => b.id !== batchId);
        recomputeItemStock(item);
        showToast('已刪除該批次', 'info');
        syncToGoogleSheet('UPDATE_INVENTORY', { itemId: item.id });
        renderEditModalContent();
        render();
    }

    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function handleAddSubmit(event) {
        event.preventDefault();
        const newItem = {
            id: 'item-' + Date.now(),
            name: document.getElementById('add-name-input').value.trim(),
            category: document.getElementById('add-cat-input').value,
            warehouseStock: parseInt(document.getElementById('add-warehouse-input').value) || 0,
            outerStock: parseInt(document.getElementById('add-outer-input').value) || 0,
            unit: document.getElementById('add-unit-input').value.trim() || '卷',
            minThreshold: parseInt(document.getElementById('add-min-input').value) || 3
        };
        items.push(newItem);
        closeModal('add-modal');
        showToast('新耗材品項新增成功！');
        syncToGoogleSheet('ADD_ITEM', newItem);
        render();
    }

    function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }

    function exportCSV() {
        let csv = "data:text/csv;charset=utf-8,\uFEFF耗材名稱,分類,倉庫庫存,外區現貨,總計庫存,單位\n";
        items.forEach(i => { csv += `"${i.name}","${i.category}",${i.warehouseStock},${i.outerStock},${i.warehouseStock + i.outerStock},"${i.unit}"\n`; });
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csv));
        link.setAttribute("download", `防護室耗材總表_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast('已成功匯出 CSV 檔案');
    }

    // ---------- Initialize ----------
    window.onload = function () {
        try {
            loadLocalCache();
            render();
            loadFromSheet(true);
        } catch (e) {
            console.error('初始化失敗：', e);
            showToast('系統初始化發生問題，請重新整理頁面', 'error');
        }
    };
</script>
</body>
</html>
