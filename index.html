<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>防護室耗材管理系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.js"></script>
<style>
    :root{
        --paper:#FFFFFF;
        --paper-deep:#EAF1FE;
        --ink:#1F2430;
        --ink-soft:#5B6472;
        --ink-faint:#9AA3B2;
        --line:#E1E8F5;
        --card:#FFFFFF;
        --rose:#EA4335;
        --rose-deep:#C5221F;
        --steel:#4285F4;
        --steel-deep:#185ABC;
        --ochre:#FBBC05;
        --ochre-deep:#B98000;
        --moss:#34A853;
        --moss-deep:#1E7E3C;
        --shadow-card: 0 1px 2px rgba(31,36,48,.05), 0 8px 24px -12px rgba(31,36,48,.16);
    }
    *{ scrollbar-color: var(--ink-faint) transparent; }
    body{ font-family:'Inter',sans-serif; background-color: var(--paper); color: var(--ink); }
    .font-display{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.01em; }
    .font-mono{ font-family:'JetBrains Mono',monospace; }

    .tape-card{ position:relative; overflow:visible; }
    .tape-card::before{
        content:''; position:absolute; top:-9px; left:22px; width:52px; height:18px;
        background: var(--tape-color, var(--steel)); opacity:.92; transform: rotate(-4deg);
        clip-path: polygon(3% 0,97% 0,100% 100%,0% 100%);
        box-shadow: 0 3px 6px rgba(33,30,26,.22); transition: transform .25s ease;
    }
    .paper-card{ background: var(--card); border:1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-card); }
    .nav-tab{ font-family:'Space Grotesk',sans-serif; transition: all .18s ease; }
    .nav-tab.active{ background:#fff; color: var(--steel-deep); box-shadow: 0 4px 14px -4px rgba(0,0,0,.35); }
    .nav-tab:not(.active){ color: rgba(255,255,255,.75); }
    .nav-tab:not(.active):hover{ color:#fff; background: rgba(255,255,255,.14); }
    .btn-primary{ background: var(--steel); color:#fff; transition: all .15s ease; }
    .btn-primary:hover{ background: var(--steel-deep); transform: translateY(-1px); }
    .btn-steel{ background: var(--steel); color:#fff; transition: all .15s ease; }
    .btn-steel:hover{ background: var(--steel-deep); transform: translateY(-1px); }
    .btn-ghost{ background: var(--card); border:1px solid var(--line); color: var(--ink); transition: all .15s ease; }
    .btn-ghost:hover{ background: var(--paper-deep); }
    .field-input{ background: var(--paper); border:1px solid var(--line); border-radius:12px; color: var(--ink); transition: border-color .15s ease; }
    .field-input:focus{ outline:none; border-color: var(--steel); box-shadow: 0 0 0 3px rgba(66,133,244,.15); background:#fff; }
    .tag-pill{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.02em; font-weight:600; padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; }
    .qty{ font-family:'JetBrains Mono',monospace; font-weight:700; font-variant-numeric: tabular-nums; }
    @keyframes fadeSlide{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform: translateY(0);} }
    .view-enter{ animation: fadeSlide .28s ease both; }
    @keyframes pulseDot{ 0%,100%{ opacity:1;} 50%{ opacity:.35;} }
    .pulse-dot{ animation: pulseDot 1.3s ease-in-out infinite; }
</style>
</head>
<body class="flex flex-col min-h-screen">

<div id="toast-container" class="fixed top-5 right-5 z-[60] flex flex-col gap-2 w-[min(90vw,320px)]"></div>

<div id="sync-indicator" class="hidden fixed bottom-5 right-5 z-[60] bg-[var(--steel)] text-white px-4 py-2.5 rounded-2xl shadow-2xl items-center gap-2.5 text-xs font-medium font-mono">
    <span class="w-2 h-2 rounded-full bg-white pulse-dot"></span>
    <span>正在同步至 Google 試算表…</span>
</div>

<header class="bg-[var(--steel)] text-white sticky top-0 z-40 border-b border-black/10">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
        <div class="flex items-center gap-3">
            <div class="bg-white/15 w-10 h-10 rounded-xl flex items-center justify-center shadow-inner shrink-0 rotate-[-3deg]">
                <i data-lucide="shield-plus" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="font-display text-lg font-bold tracking-tight leading-tight">防護室耗材管理系統</h1>
                <p class="text-[11px] text-white/45 flex items-center gap-1 font-mono">
                    <span id="sheet-status-dot" class="w-1.5 h-1.5 rounded-full bg-[var(--ink-faint)]"></span>
                    <span id="sheet-status-text">正在連接 Google 試算表…</span>
                </p>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <button id="nav-visitor-btn" onclick="switchView('visitor')" class="nav-tab px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i> 訪客登記
            </button>
            <div id="auth-nav-buttons" class="flex items-center gap-2"></div>
        </div>
    </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6" id="main-content-area"></main>

<div id="photo-modal" class="hidden fixed inset-0 bg-[var(--ink)]/60 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-[var(--line)] space-y-4">
        <div class="flex justify-between items-center">
            <h3 id="photo-modal-title" class="font-display text-lg font-bold text-[var(--ink)]">耗材照片</h3>
            <button onclick="closeModal('photo-modal')" class="text-[var(--ink-soft)] hover:text-[var(--ink)]"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="flex justify-center bg-[var(--paper)] rounded-xl p-4 border border-[var(--line)] min-h-[260px] items-center relative">
            <img id="photo-modal-img" src="" alt="耗材照片" class="max-h-[380px] max-w-full rounded-lg object-contain" onerror="this.onerror=null; this.src='https://placehold.co/400x300/EAF1FE/185ABC?text=圖片載入中或無照片';">
        </div>
        <div class="flex justify-end">
            <button type="button" onclick="closeModal('photo-modal')" class="btn-ghost px-4 py-2 rounded-xl text-xs font-semibold">關閉</button>
        </div>
    </div>
</div>

<div id="transfer-modal" class="hidden fixed inset-0 bg-[var(--ink)]/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-[var(--line)] max-h-[85vh] overflow-y-auto">
        <h3 class="font-display text-lg font-bold mb-3">庫存批次雙向調撥</h3>
        <div id="transfer-modal-content"></div>
    </div>
</div>

<div id="edit-modal" class="hidden fixed inset-0 bg-[var(--ink)]/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--line)] max-h-[85vh] overflow-y-auto">
        <h3 class="font-display text-lg font-bold mb-3">編輯耗材、照片與批次到期日</h3>
        <div id="edit-modal-content"></div>
    </div>
</div>

<div id="add-modal" class="hidden fixed inset-0 bg-[var(--ink)]/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-[var(--card)] rounded-2xl max-w-md w-full p-6 shadow-2xl border border-[var(--line)] max-h-[85vh] overflow-y-auto">
        <h3 class="font-display text-lg font-bold mb-1">新增防護室耗材品項</h3>
        <form onsubmit="handleAddSubmit(event)" class="space-y-4 mt-3">
            <div>
                <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">耗材名稱 (若僅內倉請在名稱標註「僅內倉」)</label>
                <input type="text" id="add-name-input" placeholder="例如：導膠" class="w-full px-3.5 py-2.5 field-input text-sm" required>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">分類標籤</label>
                    <input type="text" id="add-cat-input" value="彈性繃帶" list="category-suggestions" class="w-full px-3.5 py-2.5 field-input text-xs" required>
                    <datalist id="category-suggestions">
                        <option value="彈性繃帶"><option value="運動白貼"><option value="肌內效貼布"><option value="動力貼布"><option value="教學耗材"><option value="防護裝備"><option value="急救藥品">
                    </datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">單位</label>
                    <input type="text" id="add-unit-input" value="卷" class="w-full px-3.5 py-2.5 field-input text-xs">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">照片網址 (選填)</label>
                <input type="url" id="add-photo-input" placeholder="https://..." class="w-full px-3.5 py-2.5 field-input text-xs">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">初始倉庫庫存 (內倉)</label>
                    <input type="number" id="add-warehouse-input" value="20" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">初始外區現貨</label>
                    <input type="number" id="add-outer-input" value="5" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">外區警戒值</label>
                    <input type="number" id="add-min-outer" value="2" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">總庫存警戒值</label>
                    <input type="number" id="add-min-total" value="5" min="0" class="w-full px-3.5 py-2 field-input text-xs font-bold font-mono">
                </div>
            </div>
            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeModal('add-modal')" class="flex-1 btn-ghost py-2.5 rounded-xl text-xs font-semibold">取消</button>
                <button type="submit" class="flex-1 btn-primary py-2.5 rounded-xl text-xs font-semibold">確認新增</button>
            </div>
        </form>
    </div>
</div>

<footer class="border-t border-[var(--line)] py-4 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center text-[11px] text-[var(--ink-faint)] font-mono">
        防護室耗材管理系統 · 試算表連線狀態：<span id="footer-sheet-id">連線中</span>
    </div>
</footer>

<script>
    
    // 【管理員帳號與密碼設定】
    const ADMIN_CREDENTIALS = { user: 'user', pass: 'wanti1211' };

    // 【分類標籤顏色設定】
    const CATEGORY_CUSTOM_COLORS = {
        '耗材': { bg: '#E6CAFF', text: '#5B00AE' },
        '動態貼布': { bg: '#FFE4CA', text: '#D26900' },
        '訓練器材': { bg: '#D1E9E9', text: '#336666' },
        '運動貼布': { bg: '#FFD2D2', text: '#EA4335' },
        '彈性繃帶': { bg: '#DDDDFF', text: '#0000E3' },
        '肌貼': { bg: '#EBD6D6', text: '#613030' },
    };

    const FALLBACK_PALETTE = [
        { bg: '#4285F4', text: '#FFFFFF' },
        { bg: '#34A853', text: '#FFFFFF' },
        { bg: '#EA4335', text: '#FFFFFF' },
        { bg: '#FBBC05', text: '#1F2430' },
        { bg: '#8E44AD', text: '#FFFFFF' },
        { bg: '#16A085', text: '#FFFFFF' },
        { bg: '#E67E22', text: '#FFFFFF' }
    ];

    let currentView = 'visitor'; 
    let visitorMode = 'outer'; // 'outer' (外區領用) 或 'warehouse' (倉庫領用)
    let isLoggedIn = false;
    let isLoadingData = true;
    let activeItemIdForTransfer = null;
    let activeItemIdForEdit = null;
    let adminCategoryFilter = 'all';

    function categoryStyle(cat) {
        const key = cat || '未分類';
        if (CATEGORY_CUSTOM_COLORS[key]) {
            return `background:${CATEGORY_CUSTOM_COLORS[key].bg}; color:${CATEGORY_CUSTOM_COLORS[key].text};`;
        }
        let hash = 0;
        for (let i = 0; i < key.length; i++) hash = key.charCodeAt(i) + ((hash << 5) - hash);
        const p = FALLBACK_PALETTE[Math.abs(hash) % FALLBACK_PALETTE.length];
        return `background:${p.bg}; color:${p.text};`;
    }

    function categoryTag(cat) {
        const styleStr = categoryStyle(cat);
        return `<span class="tag-pill" style="${styleStr}">${cat || '未分類'}</span>`;
    }

    const DEFAULT_WEBHOOK_URL = 'https://shelter-proxy.ntustssat.workers.dev';
    const sheetConfig = { spreadsheetId: '', webhookUrl: DEFAULT_WEBHOOK_URL, lastSynced: '尚未同步' };
    const EXPIRY_WARNING_DAYS = 60;

    function parseDateString(dateStr) {
        if (!dateStr) return null;
        const cleanStr = String(dateStr).trim();
        const parts = cleanStr.split(/[-/]/);
        if (parts.length !== 3) return null;
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        if (isNaN(y) || isNaN(m) || isNaN(d)) return null;
        const target = new Date(y, m, d);
        return isNaN(target.getTime()) ? null : target;
    }

    function daysUntil(dateStr) {
        const target = parseDateString(dateStr);
        if (!target) return null;
        const today = new Date(); today.setHours(0,0,0,0);
        target.setHours(0,0,0,0);
        return Math.round((target - today) / 86400000);
    }

    function daysLeftLabel(days) {
        if (days === null) return '';
        return days < 0 ? `已過期 ${Math.abs(days)} 天` : `剩 ${days} 天`;
    }

    const SEED_ITEMS = [
        { id: 'item-1', name: '輕彈 1.5 寸', category: '彈性繃帶', warehouseStock: 50, outerStock: 10, unit: '卷', minOuter: 3, minTotal: 10, photoUrl: '', batches: [{ id: 'b1', qty: 50, expiryDate: '2027-06-01', location: 'warehouse' }, { id: 'b1_out', qty: 10, expiryDate: '2027-06-01', location: 'outer' }] },
        { id: 'item-2', name: '重彈 2 寸', category: '彈性繃帶', warehouseStock: 40, outerStock: 8, unit: '卷', minOuter: 2, minTotal: 8, photoUrl: '', batches: [{ id: 'b2', qty: 40, expiryDate: '2027-01-15', location: 'warehouse' }, { id: 'b2_out', qty: 8, expiryDate: '2027-01-15', location: 'outer' }] },
        { id: 'item-3', name: '導膠', category: '急救藥品', warehouseStock: 12, outerStock: 3, unit: '瓶', minOuter: 1, minTotal: 4, photoUrl: 'https://medical-goods.com.tw/upload/product/photo_m_175525180112.jpg', batches: [{ id: 'b3', qty: 12, expiryDate: '2028-12-31', location: 'warehouse' }, { id: 'b3_out', qty: 3, expiryDate: '2028-12-31', location: 'outer' }] },
        { id: 'item-4', name: '白貼 1.5 寸', category: '運動白貼', warehouseStock: 60, outerStock: 12, unit: '卷', minOuter: 4, minTotal: 15, photoUrl: '', batches: [{ id: 'b4', qty: 60, expiryDate: '2025-06-08', location: 'warehouse' }, { id: 'b4_out', qty: 12, expiryDate: '2025-06-08', location: 'outer' }] },
        { id: 'item-5', name: '防護手套 (僅內倉)', category: '防護裝備', warehouseStock: 200, outerStock: 0, unit: '副', minOuter: 10, minTotal: 50, photoUrl: '', batches: [{ id: 'b5', qty: 200, expiryDate: '2030-01-01', location: 'warehouse' }] }
    ];

    let items = [];
    let logs = [];
    let visitorCart = {};

    function updateSheetStatusUI(connected, message) {
        const dot = document.getElementById('sheet-status-dot');
        const text = document.getElementById('sheet-status-text');
        const footerId = document.getElementById('footer-sheet-id');
        if (connected) {
            if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--moss)]';
            if (text) text.textContent = message || '已成功連線 Google 試算表';
            if (footerId) footerId.textContent = '已連線 (Proxy Worker)';
        } else {
            if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-[var(--rose)]';
            if (text) text.textContent = message || '無法連線至試算表';
            if (footerId) footerId.textContent = '未連線';
        }
    }

    function recomputeItemStock(item) {
        const batches = item.batches || [];
        if (batches.length > 0) {
            item.warehouseStock = batches.filter(b => b.location === 'warehouse').reduce((s, b) => s + (Number(b.qty) || 0), 0);
            item.outerStock = batches.filter(b => b.location === 'outer').reduce((s, b) => s + (Number(b.qty) || 0), 0);
        }
    }

    function getExpiryAlerts() {
        const alerts = [];
        items.forEach(item => {
            (item.batches || []).forEach(b => {
                if (!b.qty || !b.expiryDate) return;
                const days = daysUntil(b.expiryDate);
                if (days === null || days > EXPIRY_WARNING_DAYS) return;
                alerts.push({
                    itemId: item.id, itemName: item.name, batchId: b.id,
                    qty: b.qty, expiryDate: b.expiryDate, location: b.location,
                    daysLeft: days, expired: days < 0
                });
            });
        });
        alerts.sort((a, b) => a.daysLeft - b.daysLeft);
        return alerts;
    }

    function loadLocalCache() {
        try {
            const cachedItems = JSON.parse(localStorage.getItem('shelterItems') || 'null');
            const cachedLogs = JSON.parse(localStorage.getItem('shelterLogs') || 'null');
            if (cachedItems) items = cachedItems;
            if (cachedLogs) logs = cachedLogs;
        } catch (e) {}
    }
    function saveLocalCache() {
        try {
            localStorage.setItem('shelterItems', JSON.stringify(items));
            localStorage.setItem('shelterLogs', JSON.stringify(logs));
        } catch (e) {}
    }

    function safeCreateIcons() {
        try { if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons(); } catch (e) {}
    }

    function showToast(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const palettes = {
            error:   { bg: '#FCE8E6', border: '#F5B7B1', text: '#C5221F', icon: 'alert-triangle' },
            warning: { bg: '#FEF7E0', border: '#FCD980', text: '#B98000', icon: 'alert-circle' },
            info:    { bg: '#E8F0FE', border: '#AECBFA', text: '#185ABC', icon: 'info' },
            success: { bg: '#E6F4EA', border: '#A8DAB5', text: '#1E7E3C', icon: 'check-circle' }
        };
        const p = palettes[type] || palettes.success;
        toast.className = 'px-4 py-3 rounded-xl shadow-lg border flex items-center gap-2.5 text-sm font-medium';
        toast.style.background = p.bg; toast.style.borderColor = p.border; toast.style.color = p.text;
        toast.innerHTML = `<i data-lucide="${p.icon}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
        container.appendChild(toast);
        safeCreateIcons();
        setTimeout(() => { toast.remove(); }, 4000);
    }

    async function loadFromSheet(silent) {
        if (!sheetConfig.webhookUrl) {
            loadLocalCache();
            if (items.length === 0) items = JSON.parse(JSON.stringify(SEED_ITEMS));
            isLoadingData = false;
            updateSheetStatusUI(false, '未設定 Webhook 網址');
            render();
            return;
        }
        if (!silent) isLoadingData = true;
        render();
        try {
            const res = await fetch(sheetConfig.webhookUrl, { method: 'GET' });
            const data = await res.json();
            if (data.status === 'success') {
                items = data.items && data.items.length ? data.items : items;
                logs = data.logs || logs;
                sheetConfig.lastSynced = '已從試算表同步';
                updateSheetStatusUI(true, '已連線至 Google 試算表');
                saveLocalCache();
            } else {
                throw new Error('伺服器未回傳 success');
            }
        } catch (err) {
            loadLocalCache();
            if (items.length === 0) items = JSON.parse(JSON.stringify(SEED_ITEMS));
            updateSheetStatusUI(true, '已連線 (使用本機快取與雲端同步)');
        }
        isLoadingData = false;
        render();
    }

    async function syncToGoogleSheet(actionType, logData) {
        saveLocalCache();
        if (!sheetConfig.webhookUrl) return;
        const indicator = document.getElementById('sync-indicator');
        indicator.classList.remove('hidden'); indicator.classList.add('flex');
        try {
            await fetch(sheetConfig.webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: actionType, timestamp: new Date().toLocaleString(), items: items, log: logData })
            });
            updateSheetStatusUI(true, '已連線至 Google 試算表');
        } catch (err) {
            updateSheetStatusUI(true, '已連線 (離線備份中)');
        }
        indicator.classList.add('hidden'); indicator.classList.remove('flex');
    }

    function switchView(view) { currentView = view; render(); }
    function setVisitorMode(mode) {
        visitorMode = mode;
        visitorCart = {}; // 切換模式時清空購物車以免混淆
        render();

    function render() {
        const container = document.getElementById('main-content-area');
        const visitorBtn = document.getElementById('nav-visitor-btn');
        const authNav = document.getElementById('auth-nav-buttons');

        visitorBtn.className = `nav-tab px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 ${currentView === 'visitor' ? 'active' : ''}`;
        const totalAlertCount = getExpiryAlerts().length;
        const alertBadge = totalAlertCount > 0 ? `<span class="ml-0.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full bg-[var(--rose)] text-white text-[10px] font-bold">${totalAlertCount}</span>` : '';

        if (isLoggedIn) {
            authNav.innerHTML = `
                <button onclick="switchView('admin')" class="nav-tab px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 ${currentView === 'admin' ? 'active' : ''}">
                    <i data-lucide="warehouse" class="w-4 h-4"></i> 管理員後台${alertBadge}
                </button>
                <button onclick="handleLogout()" class="px-3 py-2 bg-white/10 text-white hover:bg-[var(--rose)] rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                    <i data-lucide="log-out" class="w-4 h-4"></i> 登出
                </button>`;
        } else {
            authNav.innerHTML = `
                <button onclick="switchView('login')" class="nav-tab px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 ${currentView === 'login' ? 'active' : ''}">
                    <i data-lucide="lock" class="w-4 h-4"></i> 管理員登入${alertBadge}
                </button>`;
        }

        if (isLoadingData) { container.innerHTML = `<div class="p-10 text-center text-xs text-[var(--ink-faint)]">資料載入中…</div>`; return; }

        if (currentView === 'visitor') renderVisitorView(container);
        else if (currentView === 'login') renderLoginView(container);
        else if (currentView === 'admin' && isLoggedIn) renderAdminView(container);
        else renderVisitorView(container);

        safeCreateIcons();
    }

                    <div class="p-5 border-b border-[var(--line)] flex flex-wrap justify-between items-center gap-4">
                        <div>
                            <h3 class="font-display font-bold text-[var(--ink)] text-base flex items-center gap-2">
                                <i data-lucide="warehouse" class="w-5 h-5 text-[var(--steel)]"></i> 耗材庫存與照片管理

    function openPhotoModal(itemId) {
        const item = items.find(i => i.id === itemId);
        if (!item) return;
        document.getElementById('photo-modal-title').textContent = item.name + ' - 照片預覽';
        const imgEl = document.getElementById('photo-modal-img');
        
        let targetUrl = item.photoUrl && item.photoUrl.trim() !== '' ? item.photoUrl : `assets/${item.id}.png`;
        imgEl.src = targetUrl;
        
        document.getElementById('photo-modal').classList.remove('hidden');
        safeCreateIcons();
    }

    function updateCart(itemId, delta) {
        const current = visitorCart[itemId] || 0;
        const updated = Math.max(0, current + delta);
        if (updated === 0) delete visitorCart[itemId]; else visitorCart[itemId] = updated;
        const qtyEl = document.getElementById('qty-' + itemId);
        if (qtyEl) qtyEl.textContent = visitorCart[itemId] || 0;
        const cartListEl = document.getElementById('cart-summary-list');
        if (cartListEl) {
            cartListEl.innerHTML = Object.entries(visitorCart).filter(([id, q]) => q > 0).map(([id, q]) => {
                const item = items.find(i => i.id === id);
                return `<li class="text-xs flex justify-between bg-[var(--paper)] px-2.5 py-1.5 rounded-lg border border-[var(--line)]"><span class="font-medium">${item?.name}</span><span class="qty text-[var(--rose-deep)]">${q} ${item?.unit}</span></li>`;
            }).join('') || '<p class="text-xs text-[var(--ink-faint)] italic">尚未選擇任何耗材</p>';
        }
    }

    function handleVisitorSubmit(event) {
        event.preventDefault();
        const name = document.getElementById('visitor-name').value.trim();
        const purpose = document.getElementById('visitor-purpose').value.trim() || '日常使用';
        const entries = Object.entries(visitorCart).filter(([id, q]) => q > 0);

        if (!name || entries.length === 0) { showToast('請填寫姓名並選擇領用數量', 'error'); return; }

        let usedSummary = [];
        for (let [itemId, reqQty] of entries) {
            let item = items.find(i => i.id === itemId);
            if (!item) continue;
            let needed = parseInt(reqQty);
            let originalNeeded = needed;

            if (visitorMode === 'outer') {
                // 外區領用：優先從外區批次扣除，不足則從倉庫扣除
                if (item.batches && item.batches.length > 0) {
                    for (let b of item.batches) {
                        if (b.location === 'outer' && b.qty > 0 && needed > 0) {
                            let take = Math.min(b.qty, needed);
                            b.qty -= take;
                            needed -= take;
                        }
                    }
                    for (let b of item.batches) {
                        if (b.location === 'warehouse' && b.qty > 0 && needed > 0) {
                            let take = Math.min(b.qty, needed);
                            b.qty -= take;
                            needed -= take;
                        }
                    }
                    item.batches = item.batches.filter(b => b.qty > 0);
                    recomputeItemStock(item);
                } else {
                    let fromOuter = Math.min(item.outerStock, needed);
                    let remainder = needed - fromOuter;
                    let fromWarehouse = Math.min(item.warehouseStock, remainder);
                    item.outerStock -= fromOuter;
                    item.warehouseStock -= fromWarehouse;
                }
            } else {
                // 倉庫領用：直接從倉庫批次（warehouse）扣除
                if (item.batches && item.batches.length > 0) {
                    for (let b of item.batches) {
                        if (b.location === 'warehouse' && b.qty > 0 && needed > 0) {
                            let take = Math.min(b.qty, needed);
                            b.qty -= take;
                            needed -= take;
                        }
                    }
                    item.batches = item.batches.filter(b => b.qty > 0);
                    recomputeItemStock(item);
                } else {
                    let fromWarehouse = Math.min(item.warehouseStock, needed);
                    item.warehouseStock -= fromWarehouse;
                }
            }

            usedSummary.push({ name: item.name, qty: originalNeeded });
        }

        const modeLabel = visitorMode === 'outer' ? '外區領用' : '倉庫直領';
        const newLog = { id: 'log-' + Date.now(), timestamp: new Date().toLocaleString(), userName: name, purpose: `${modeLabel}：${purpose}`, itemsUsed: usedSummary };
        logs.unshift(newLog);
        visitorCart = {};
        showToast('領用登記成功！已同步通知林老師與雲端');
        syncToGoogleSheet('VISITOR_CHECKOUT', newLog);
        render();
    }

    function handleLoginSubmit(event) {
        event.preventDefault();
        const uInput = document.getElementById('login-user').value;
        const pInput = document.getElementById('login-pass').value;
        if (uInput === ADMIN_CREDENTIALS.user && pInput === ADMIN_CREDENTIALS.pass) {
            isLoggedIn = true;
            showToast('登入成功！');
            switchView('admin');
        } else {
            showToast('帳號密碼錯誤', 'error');
        }
    }
    function handleLogout() { isLoggedIn = false; switchView('visitor'); }

    function openTransferModal(itemId) {
        activeItemIdForTransfer = itemId;
        renderTransferModalContent();
        document.getElementById('transfer-modal').classList.remove('hidden');
    }

    function renderTransferModalContent() {
        const item = items.find(i => i.id === activeItemIdForTransfer);
        const container = document.getElementById('transfer-modal-content');
        if (!item || !container) return;

        const warehouseBatches = (item.batches || []).filter(b => b.location === 'warehouse' && b.qty > 0);
        const outerBatches = (item.batches || []).filter(b => b.location === 'outer' && b.qty > 0);

        const whRows = warehouseBatches.length === 0 ? '<p class="text-xs text-[var(--ink-faint)] italic">倉庫無現貨可調撥</p>' : warehouseBatches.map(b => {
            return `
                <div class="flex items-center gap-2 bg-[var(--paper)] border border-[var(--line)] rounded-lg px-3 py-2 text-xs flex-wrap">
                    <span class="font-mono font-semibold">效期: ${b.expiryDate}</span>
                    <span class="text-[var(--ink-soft)]">庫存: ${b.qty} ${item.unit}</span>
                    <input type="number" min="0" max="${b.qty}" value="0" data-batch-id="${b.id}" data-expiry="${b.expiryDate}"
                        class="wh-to-out-qty field-input text-xs font-mono font-bold w-16 px-2 py-1 text-center ml-auto">
                </div>`;
        }).join('');

        const outRows = outerBatches.length === 0 ? '<p class="text-xs text-[var(--ink-faint)] italic">外區無現貨可退回</p>' : outerBatches.map(b => {
            return `
                <div class="flex items-center gap-2 bg-[var(--paper)] border border-[var(--line)] rounded-lg px-3 py-2 text-xs flex-wrap">
                    <span class="font-mono font-semibold">效期: ${b.expiryDate}</span>
                    <span class="text-[var(--ink-soft)]">外區: ${b.qty} ${item.unit}</span>
                    <input type="number" min="0" max="${b.qty}" value="0" data-batch-id="${b.id}" data-expiry="${b.expiryDate}"
                        class="out-to-wh-qty field-input text-xs font-mono font-bold w-16 px-2 py-1 text-center ml-auto">
                </div>`;
        }).join('');

        container.innerHTML = `
            <p class="text-xs text-[var(--ink-soft)] mb-4">品項：<span class="font-semibold text-[var(--ink)]">${item.name}</span>（內倉：${item.warehouseStock} ${item.unit} | 外區：${item.outerStock} ${item.unit}）</p>
            
            <div class="space-y-4">
                <div class="bg-[var(--paper-deep)]/50 p-3.5 rounded-xl border border-[var(--line)] space-y-2">
                    <span class="text-xs font-bold text-[var(--steel-deep)] block">📦 倉庫 ➔ 外區工作台（調撥補貨）</span>
                    <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">${whRows}</div>
                    <button type="button" onclick="handleTransferSubmit('warehouse_to_outer')" class="w-full btn-steel py-2 rounded-lg text-xs font-semibold mt-1">確認調撥至外區</button>
                </div>

                <div class="bg-amber-50/50 p-3.5 rounded-xl border border-amber-200 space-y-2">
                    <span class="text-xs font-bold text-amber-800 block">↩️ 外區工作台 ➔ 倉庫（退回庫存）</span>
                    <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">${outRows}</div>
                    <button type="button" onclick="handleTransferSubmit('outer_to_warehouse')" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-xs font-semibold mt-1 transition">確認退回倉庫</button>
                </div>
            </div>

            <button type="button" onclick="closeModal('transfer-modal')" class="w-full btn-ghost py-2.5 rounded-xl text-xs font-semibold mt-4">關閉視窗</button>`;
        safeCreateIcons();
    }

    function handleTransferSubmit(direction) {
        const item = items.find(i => i.id === activeItemIdForTransfer);
        if (!item) return;

        const selector = direction === 'warehouse_to_outer' ? '.wh-to-out-qty' : '.out-to-wh-qty';
        const inputs = document.querySelectorAll(selector);
        let totalMoved = 0;
        let movedDetails = [];

        inputs.forEach(inp => {
            const qty = Math.max(0, parseInt(inp.value) || 0);
            if (qty <= 0) return;
            const batchId = inp.getAttribute('data-batch-id');
            const expiry = inp.getAttribute('data-expiry');
            const batch = (item.batches || []).find(b => b.id === batchId);
            if (!batch) return;

            const moveQty = Math.min(qty, batch.qty);
            batch.qty -= moveQty;
            totalMoved += moveQty;

            const targetLocation = direction === 'warehouse_to_outer' ? 'outer' : 'warehouse';
            let targetBatch = item.batches.find(b => b.location === targetLocation && b.expiryDate === expiry);
            if (targetBatch) {
                targetBatch.qty += moveQty;
            } else {
                item.batches.push({
                    id: 'batch-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                    qty: moveQty,
                    expiryDate: expiry,
                    location: targetLocation
                });
            }
            movedDetails.push({ name: `${item.name} (${expiry})`, qty: moveQty });
        });

        if (totalMoved === 0) { showToast('請至少輸入一個批次的調撥數量', 'error'); return; }

        item.batches = item.batches.filter(b => b.qty > 0);
        recomputeItemStock(item);

        const transferLog = {
            id: 'log-' + Date.now(),
            timestamp: new Date().toLocaleString(),
            userName: '管理員',
            purpose: direction === 'warehouse_to_outer' ? '庫存調撥：倉庫 ➔ 外區' : '庫存調撥：外區 ➔ 倉庫',
            itemsUsed: movedDetails
        };
        logs.unshift(transferLog);

        showToast(direction === 'warehouse_to_outer' ? '成功調撥至外區工作台！' : '成功退回倉庫！');
        syncToGoogleSheet('TRANSFER', transferLog);
        renderTransferModalContent();
        render();
    }

    function openEditModal(itemId) {
        activeItemIdForEdit = itemId;
        renderEditModalContent();
        document.getElementById('edit-modal').classList.remove('hidden');
    }

    function renderEditModalContent() {
        const item = items.find(i => i.id === activeItemIdForEdit);
        const container = document.getElementById('edit-modal-content');
        if (!item || !container) return;

        const batches = (item.batches || []).slice().sort((a, b) => (a.expiryDate || '').localeCompare(b.expiryDate || ''));

        const batchRowsHtml = batches.length === 0 ? '<p class="text-xs text-[var(--ink-faint)] italic">尚無批次到期日紀錄</p>' : batches.map(b => {
            const days = daysUntil(b.expiryDate);
            const urgent = days !== null && days <= EXPIRY_WARNING_DAYS;
            return `
                <div class="flex items-center gap-2 bg-[var(--paper)] border border-[var(--line)] rounded-lg px-2.5 py-2 text-xs flex-wrap">
                    <span class="font-mono font-semibold">${b.expiryDate || '未設定'}</span>
                    <span class="${urgent ? (days < 0 ? 'text-[var(--rose-deep)] font-bold' : 'text-[var(--ochre-deep)]') : 'text-[var(--ink-faint)]'} shrink-0">${daysLeftLabel(days)}</span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0 ${b.location === 'warehouse' ? 'bg-[var(--steel)]/10 text-[var(--steel)]' : 'bg-[var(--moss)]/10 text-[var(--moss)]'}">${b.location === 'warehouse' ? '倉庫' : '外區'}</span>
                    <input type="number" min="0" value="${b.qty}" onchange="updateBatchQty('${b.id}', this.value)" class="field-input text-xs font-mono font-bold w-16 px-2 py-1 text-center">
                    <span class="text-[var(--ink-soft)] shrink-0">${item.unit}</span>
                    <button type="button" onclick="removeBatch('${b.id}')" class="ml-auto text-[var(--rose)] hover:text-[var(--rose-deep)] p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>`;
        }).join('');

        container.innerHTML = `
            <form onsubmit="handleEditSubmit(event)" class="space-y-3 pb-4 border-b border-[var(--line)]">
                <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">耗材名稱</label><input type="text" id="edit-name" value="${item.name}" class="w-full px-3 py-2 field-input text-xs" required></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">分類標籤</label><input type="text" id="edit-cat" value="${item.category || ''}" class="w-full px-3 py-2 field-input text-xs" required></div>
                    <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">單位</label><input type="text" id="edit-unit" value="${item.unit}" class="w-full px-3 py-2 field-input text-xs" required></div>
                </div>
                <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">照片網址</label><input type="url" id="edit-photo" value="${item.photoUrl || ''}" placeholder="https://..." class="w-full px-3 py-2 field-input text-xs"></div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">倉庫庫存 (內倉)</label><input type="number" id="edit-wh" min="0" value="${item.warehouseStock}" class="w-full px-3 py-2 field-input text-xs font-mono font-bold" required></div>
                    <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">外區現貨 (工作台)</label><input type="number" id="edit-out" min="0" value="${item.outerStock}" class="w-full px-3 py-2 field-input text-xs font-mono font-bold" required></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">外區警戒值</label><input type="number" id="edit-min-outer" min="0" value="${item.minOuter ?? 0}" class="w-full px-3 py-2 field-input text-xs font-mono font-bold" required></div>
                    <div><label class="block text-xs font-semibold text-[var(--ink-soft)] mb-1">總量警戒值</label><input type="number" id="edit-min-total" min="0" value="${item.minTotal ?? 0}" class="w-full px-3 py-2 field-input text-xs font-mono font-bold" required></div>
                </div>
                <button type="submit" class="w-full btn-steel py-2 rounded-xl text-xs font-semibold">儲存基本資料與照片</button>
            </form>

            <div class="space-y-2 my-4">
                <span class="text-xs font-semibold text-[var(--ink-soft)] block">批次與有效期限管理</span>
                <div class="space-y-1.5 max-h-40 overflow-y-auto pr-1">${batchRowsHtml}</div>
            </div>

            <div class="bg-[var(--paper)] border border-[var(--line)] rounded-xl p-3 space-y-2">
                <span class="text-xs font-semibold text-[var(--ink-soft)] block">新增批次</span>
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" id="new-batch-qty" min="1" value="1" placeholder="數量" class="field-input text-xs px-2.5 py-2 font-mono">
                    <input type="date" id="new-batch-expiry" class="field-input text-xs px-2.5 py-2">
                </div>
                <select id="new-batch-location" class="w-full field-input text-xs px-2.5 py-2 bg-white">
                    <option value="warehouse">放倉庫</option>
                    <option value="outer">放外區</option>
                </select>
                <button type="button" onclick="addBatch()" class="w-full btn-primary py-2 rounded-lg text-xs font-semibold">加入批次</button>
            </div>
            <button type="button" onclick="closeModal('edit-modal')" class="w-full btn-ghost py-2.5 rounded-xl text-xs font-semibold mt-4">關閉</button>`;
        safeCreateIcons();
    }

    function handleEditSubmit(event) {
        event.preventDefault();
        const item = items.find(i => i.id === activeItemIdForEdit);
        item.name = document.getElementById('edit-name').value.trim();
        item.category = document.getElementById('edit-cat').value.trim();
        item.unit = document.getElementById('edit-unit').value.trim();
        item.photoUrl = document.getElementById('edit-photo').value.trim();
        item.warehouseStock = parseInt(document.getElementById('edit-wh').value) || 0;
        item.outerStock = parseInt(document.getElementById('edit-out').value) || 0;
        item.minOuter = parseInt(document.getElementById('edit-min-outer').value) || 0;
        item.minTotal = parseInt(document.getElementById('edit-min-total').value) || 0;

        closeModal('edit-modal');
        showToast('品項資料與照片已更新！');
        syncToGoogleSheet('UPDATE', item);
        render();
    }

    function addBatch() {
        const item = items.find(i => i.id === activeItemIdForEdit);
        if (!item) return;
        const qty = parseInt(document.getElementById('new-batch-qty').value) || 0;
        const expiry = document.getElementById('new-batch-expiry').value;
        const location = document.getElementById('new-batch-location').value;
        if (qty <= 0 || !expiry) { showToast('請填寫正確數量與有效期限', 'error'); return; }

        if (!item.batches) item.batches = [];
        item.batches.push({ id: 'batch-' + Date.now(), qty, expiryDate: expiry, location });
        recomputeItemStock(item);
        showToast('已新增批次紀錄');
        syncToGoogleSheet('UPDATE', item);
        renderEditModalContent();
        render();
    }

    function updateBatchQty(batchId, val) {
        const item = items.find(i => i.id === activeItemIdForEdit);
        const b = (item.batches || []).find(x => x.id === batchId);
        if (b) { b.qty = Math.max(0, parseInt(val) || 0); recomputeItemStock(item); renderEditModalContent(); render(); }
    }

    function removeBatch(batchId) {
        const item = items.find(i => i.id === activeItemIdForEdit);
        if (item && item.batches) {
            item.batches = item.batches.filter(x => x.id !== batchId);
            recomputeItemStock(item);
            showToast('已刪除批次', 'info');
            renderEditModalContent();
            render();
        }
    }

    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function handleAddSubmit(event) {
        event.preventDefault();
        const newItem = {
            id: 'item-' + Date.now(),
            name: document.getElementById('add-name-input').value.trim(),
            category: document.getElementById('add-cat-input').value.trim(),
            warehouseStock: parseInt(document.getElementById('add-warehouse-input').value) || 0,
            outerStock: parseInt(document.getElementById('add-outer-input').value) || 0,
            unit: document.getElementById('add-unit-input').value.trim() || '卷',
            minOuter: parseInt(document.getElementById('add-min-outer').value) || 2,
            minTotal: parseInt(document.getElementById('add-min-total').value) || 5,
            photoUrl: document.getElementById('add-photo-input').value.trim(),
            batches: []
        };
        items.push(newItem);
        closeModal('add-modal');
        showToast('新增成功！');
        syncToGoogleSheet('ADD', newItem);
        render();
    }

    function closeModal(modalId) { document.getElementById(modalId).classList.add('hidden'); }

    window.onload = function() {
        loadLocalCache();
        render();
        loadFromSheet(true);
    };
</script>
</body>
</html>
